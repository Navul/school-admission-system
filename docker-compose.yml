services:
  postgres:
    image: postgres:16-alpine
    container_name: admission_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: school_admission
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admission_backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: "Host=postgres;Port=5432;Database=school_admission;Username=postgres;Password=postgrespassword"
      HOLD_DURATION_SECONDS: "600"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: admission_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: